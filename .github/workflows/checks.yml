name: Gridworld checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.16"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check Python code with Ruff
        run: uv run ruff check gridworld tests
      - name: Run all game tests
        run: uv run python -m pytest -q
